# Minimal broker for a single-host, trusted-LAN deployment.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice

# If this broker is ever reachable beyond your LAN, turn anonymous access off and
# add a password file:
#   allow_anonymous false
#   password_file /mosquitto/config/passwd
